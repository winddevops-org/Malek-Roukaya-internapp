name: Trigger Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        required: true
        type: choice
        default: 'staging'
        options:
          - staging
          - production

jobs:
  call-router:
    uses: winddevops-org/devops-templates/.github/workflows/deploy.yml@main
    with:
      environment: ${{ inputs.environment }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
